name: Build Release APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Restore pub packages
        run: flutter pub get

      - name: Verify analysis_options present
        run: ls -la analysis_options.yaml

      # NOTE: We skip `flutter analyze` here because the API key file is
      # gitignored and the analyzer may not have it. We instead just
      # ensure pub get + build succeeds.

      - name: Verify Android project structure
        run: |
          echo "=== Files in android/ ==="
          ls -la android/
          echo ""
          echo "=== Files in android/app/ ==="
          ls -la android/app/
          echo ""
          echo "=== AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml
          echo ""
          echo "=== MainActivity.kt ==="
          cat android/app/src/main/kotlin/com/kzm/app/MainActivity.kt
          echo ""
          echo "=== app/build.gradle ==="
          cat android/app/build.gradle
          echo ""
          echo "=== root build.gradle ==="
          cat android/build.gradle
          echo ""
          echo "=== settings.gradle ==="
          cat android/settings.gradle
          echo ""
          echo "=== pubspec.yaml ==="
          cat pubspec.yaml

      - name: Build release APK (verbose)
        run: flutter build apk --release --no-tree-shake-icons --verbose

      - name: List build artifacts
        run: ls -la build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kzm-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: (Optional) Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: KZM Build v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
